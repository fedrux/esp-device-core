name: Compile example

on:
  push:
  pull_request:

jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/run_native.py
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - fqbn: esp8266:esp8266:nodemcuv2
            core: esp8266:esp8266
            url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
          - fqbn: esp32:esp32:esp32
            core: esp32:esp32
            url: ""
          - fqbn: esp32:esp32:esp32c3:CDCOnBoot=cdc
            core: esp32:esp32
            url: ""
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - if: matrix.url != ''
        run: arduino-cli config add board_manager.additional_urls ${{ matrix.url }}
      - run: arduino-cli core update-index
      - run: arduino-cli core install ${{ matrix.core }}
      - run: cp examples/BasicDevice/secrets.example.h examples/BasicDevice/secrets.h
      - run: arduino-cli compile --fqbn ${{ matrix.fqbn }} --library . examples/BasicDevice
